# lcm-ai-proxy:免費體驗代理。部署與自架步驟見 README.md
name = "lcm-ai-proxy"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
# 只服務這些 Origin(逗號分隔);自架請改成你的網域
ALLOWED_ORIGINS = "https://yazelin.github.io"
# 鎖定的 model(執行/工具呼叫;不接受前端指定其他 model)
MODEL = "openai/gpt-oss-120b"
# 會被路由到 llm-share(朋友的閘道)的 model 白名單,逗號分隔;不在清單上的一律走上面的 Groq。
# 預設「劇本強化」送的是 glm-5.2,其餘要在連線設定自己填 model 名才會用到。
# 這裡放的是那台的全部模型(2026-08-11 以 `llmshare models` 取得)。朋友說水管夠大,不必為單價設限;
# 真正的閘是下面的 GLM_IP_DAILY / GLM_GLOBAL_DAILY,那兩個才是保護他 key 的東西。
# 那邊上下架模型時記得回來同步這一行,名字對不上就會被安靜改寫成 Groq。
WRITER_MODELS = "nemotron-3-super,deepseek-v4-flash:0731,qwen3.5:397b,deepseek-v4-pro,kimi-k2.7-code,minimax-m2.7,minimax-m3,mistral-large-3:675b,glm-5.1,gpt-oss:20b,glm-5.2,gpt-oss:120b,nemotron-3-nano:30b,gemma4:31b,deepseek-v4-flash:preview,kimi-k2.6,nemotron-3-ultra"
WRITER_MODEL = "glm-5.2" # 相容用:舊版只認這一個
LLMSHARE_BASE = "https://llm-share.duotify.com/v1"
# 編劇(GLM)獨立且更緊的每日額度,保護朋友的 key(Origin 可偽造,不能只靠共用的 GLOBAL_DAILY)。依朋友 key 容量調整。
GLM_IP_DAILY = "20"
GLM_GLOBAL_DAILY = "2000"
# 每 IP 每日 AI 呼叫上限(約 20 次=1 個完整作品)
IP_DAILY = "60"
# 全站每日熔斷:成本天花板 = GLOBAL_DAILY x 單次呼叫成本(5000 次 ≈ US$5)。
# 2026-08-11 為了在大群分享暫時放大,平常值是 1200。每 IP 維持 60 不動,單一個人吃不光。
GLOBAL_DAILY = "5000"
# AI 補圖(codex-image-service,走站長 ChatGPT 額度):額度獨立於文字
CODEX_IMAGE_BASE = "https://ching-tech.ddns.net/codex-image"
IMG_IP_DAILY = "2"
IMG_GLOBAL_DAILY = "20"

# 共享區梯次代號(投稿與清單都用它);換梯次改這裡
WALL_EVENT = "chat-2026-08-12"

# 額度計數用 D1(沿用既有庫,只新增 lcm_quota 表;自架請換成自己的庫)
[[d1_databases]]
binding = "DB"
database_name = "k-rider-signups"
database_id = "843337b7-ef58-4e6a-8e12-759e5d5b379c"

# GROQ_API_KEY 走 secret,不放這裡:
#   cd worker && npx wrangler secret put GROQ_API_KEY
# WALL_UPLOAD_CODE 走 secret(共享區活動碼,沒設=不開放投稿):
#   cd worker && npx wrangler secret put WALL_UPLOAD_CODE
# WALL_ADMIN_TOKEN 走 secret(主持人管理權杖,能刪任何一筆):
#   cd worker && npx wrangler secret put WALL_ADMIN_TOKEN
# LLMSHARE_API_KEY 走 secret(朋友的 GLM 虛擬 key,絕不放這裡/前端;沒設時編劇自動退回 Groq):
#   cd worker && npx wrangler secret put LLMSHARE_API_KEY
